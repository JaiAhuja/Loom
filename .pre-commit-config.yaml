default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args:
          - --branch
          - main

  - repo: local
    hooks:
      - id: inline-comments
        name: Enforce inline Python comments
        entry: python scripts/check_inline_comments.py --fix
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
