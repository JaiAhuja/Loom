# =============================================================================
# Neo4j - Knowledge Graph Database
# =============================================================================
# Run with: docker-compose up -d
# Access Neo4j Browser at: http://localhost:7474
#
# SECURITY: the default password below (Loom-Weave-Threads) is for LOCAL
# DEVELOPMENT ONLY. Before running this on a shared / networked / cloud host:
#   1. Set NEO4J_PASSWORD in a local .env (docker-compose will pick it up via
#      the ${NEO4J_PASSWORD:-...} expansion) or edit this file.
#   2. Also update NEO4J_PASSWORD in your app's .env so the driver can connect.
#   3. Do NOT commit the real password.
# =============================================================================

services:
  neo4j:
    image: neo4j:5-community
    container_name: loom-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (driver connections)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-Loom-Weave-Threads}
      - NEO4J_PLUGINS=["apoc"]
      # Keep the JVM from ballooning on a dev laptop. Tune these if you have
      # a larger graph / more RAM to spare.
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  neo4j_data:
  neo4j_logs:
